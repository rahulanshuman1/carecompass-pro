name: Build iOS app

# Always builds the iOS project (Capacitor) so you know it compiles, and publishes an unsigned
# simulator build to the rolling "ios-latest" release.
#
# A real, installable iPhone build (IPA) and TestFlight upload need an Apple Developer account
# ($99/year). Add the secrets listed in DEPLOYMENT.md → "iOS" and the signed steps switch on by themselves.
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/ios.yml']
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-14
    timeout-minutes: 60
    defaults:
      run:
        working-directory: web
    env:
      VITE_API_URL: ${{ vars.API_URL || 'https://carecompass-pro.onrender.com/api/v1' }}
      BUNDLE_ID: com.carecompass.app
      HAS_SIGNING: ${{ secrets.IOS_CERT_P12_BASE64 != '' && secrets.IOS_PROFILE_BASE64 != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install and build the web app
        run: |
          npm ci
          npm install --no-save @capacitor/ios@^7.0.0
          npm run build

      - name: Create the native iOS project
        run: |
          npx cap add ios
          npx --yes @capacitor/assets@3 generate --ios --assetPath assets
          npx cap sync ios

      - name: Camera and photo permissions
        run: |
          P=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string CareCompass uses the camera so you can photograph your meals." "$P" || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string CareCompass lets you choose a meal or profile photo from your library." "$P" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$P"

      # ---------- Always: unsigned simulator build (proves the project compiles) ----------
      - name: Build for the iOS simulator
        working-directory: web/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -n 25
          cd build/Build/Products/Debug-iphonesimulator && zip -qr "$GITHUB_WORKSPACE/web/CareCompass-simulator.zip" App.app

      # ---------- Only when Apple signing secrets exist: signed IPA ----------
      - name: Build signed IPA
        if: env.HAS_SIGNING == 'true'
        working-directory: web/ios/App
        env:
          CERT_P12: ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD || 'app-store' }}   # app-store (TestFlight) | ad-hoc | development
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"; KCPW="$(uuidgen)"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPW" "$KC"
          security list-keychains -d user -s "$KC" login.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/p.mobileprovision"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/p.mobileprovision")")
          PNAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/p.mobileprovision")")
          cp "$RUNNER_TEMP/p.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -archivePath build/App.xcarchive \
            -destination 'generic/platform=iOS' archive \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" PROVISIONING_PROFILE_SPECIFIER="$PNAME" | tail -n 15
          cat > build/export.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>$EXPORT_METHOD</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PNAME</string></dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportOptionsPlist build/export.plist -exportPath build/ipa | tail -n 10
          cp build/ipa/*.ipa "$GITHUB_WORKSPACE/web/CareCompass.ipa"

      - name: Upload to TestFlight
        if: env.HAS_SIGNING == 'true' && env.ASC_KEY_ID != ''
        working-directory: web
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_KEY_BASE64" | base64 --decode > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          xcrun altool --upload-app --type ios -f CareCompass.ipa --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - uses: actions/upload-artifact@v4
        with:
          name: CareCompass-ios
          path: |
            web/CareCompass-simulator.zip
            web/CareCompass.ipa
          if-no-files-found: ignore
          retention-days: 30

      - name: Move the ios-latest tag to this commit
        working-directory: .
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git tag -f ios-latest
          git push -f origin ios-latest

      - name: Publish to the ios-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-latest
          name: CareCompass iOS build (latest)
          body: |
            iOS build #${{ github.run_number }} (commit ${{ github.sha }}).
            `CareCompass-simulator.zip` runs only in the Xcode iOS Simulator. A real-iPhone `CareCompass.ipa` is attached only when Apple signing secrets are configured.
            iPhone users can meanwhile open the website in Safari → Share → Add to Home Screen.
          files: |
            web/CareCompass-simulator.zip
            web/CareCompass.ipa
          fail_on_unmatched_files: false

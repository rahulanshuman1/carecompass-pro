# Render Blueprint: New + → Blueprint → pick this repo. Secrets marked sync:false are entered in the dashboard.
services:
  - type: web
    name: carecompass-api
    runtime: node
    rootDir: server
    plan: starter            # Starter or higher keeps the service awake (free tier sleeps and delays webhooks)
    region: singapore        # closest Render region to India
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: PHI_ENCRYPTION_KEY   # DO NOT lose or rotate casually: existing encrypted fields become unreadable
        sync: false
      - key: CLIENT_ORIGINS       # e.g. https://carecompass.vercel.app,https://app.yourdomain.com
        sync: false
      - key: COOKIE_SAMESITE
        value: lax
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
